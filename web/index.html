<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-title" content="raptOR"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>raptOR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Math:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one-column phone app. Sticky brand header, one scrolling body, fixed tab bar.
   Pantone 222 C (#6C1D45) on ivory; tier shades are tints/shades of its hue (330°). STIX Two Math for display and numbers, DM Mono for labels. */
:root{
  --bg:#FFFFF0; --card:#FFFFFA; --ink:#1A0010; --ink2:#4A2040; --ink3:#7A4766;
  --line:rgba(108,29,69,.18); --line2:rgba(108,29,69,.45);
  --accent:#6C1D45; --accent-ink:#FFFFF0; --soft:rgba(108,29,69,.07);
  --good:#146C3A; --bad:#B42318; --warn:#8A5A00;
  --h1:#F1DFE8; --h2:#DEAAC4; --h3:#B35685; --h4:#8E2F5E; --h5:#6C1D45;
  --ht1:#4A2040; --ht2:#2A0A20; --ht3:#FFFFF0; --ht4:#FFFFF0; --ht5:#FFFFF0;
  --serif:'STIX Two Math','Times New Roman',Georgia,serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150010; --card:#1F0818; --ink:#F6EFE2; --ink2:#DCC6D3; --ink3:#AD8FA0;
    --line:rgba(223,134,179,.2); --line2:rgba(223,134,179,.5);
    --accent:#DF86B3; --accent-ink:#1A0010; --soft:rgba(223,134,179,.1);
    --good:#5FD18E; --bad:#FF8F85; --warn:#E8B04A;
    --h1:#3B1629; --h2:#5F2B45; --h3:#8F3D66; --h4:#C0598C; --h5:#DF86B3;
    --ht1:#DCC6D3; --ht2:#F6EFE2; --ht3:#FFFFF0; --ht4:#1A0010; --ht5:#1A0010;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150010; --card:#1F0818; --ink:#F6EFE2; --ink2:#DCC6D3; --ink3:#AD8FA0;
  --line:rgba(223,134,179,.2); --line2:rgba(223,134,179,.5);
  --accent:#DF86B3; --accent-ink:#1A0010; --soft:rgba(223,134,179,.1);
  --good:#5FD18E; --bad:#FF8F85; --warn:#E8B04A;
  --h1:#3B1629; --h2:#5F2B45; --h3:#8F3D66; --h4:#C0598C; --h5:#DF86B3;
  --ht1:#DCC6D3; --ht2:#F6EFE2; --ht3:#FFFFF0; --ht4:#1A0010; --ht5:#1A0010;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:30px;height:30px;flex:none;color:var(--accent)}
.wm{font-size:24px;font-weight:700;letter-spacing:.01em;line-height:1}
.wm span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.sync{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink3);display:inline-block}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--warn)}

main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.card h2{font-size:18px}
.card h3{font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink3)} .ink2{color:var(--ink2)}
.small{font-size:13px}
.hr{height:1px;background:var(--line);margin:2px 0}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-weight:700;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{display:flex;width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.link{border:0;min-height:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:400;background:none}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical;font-family:var(--mono);font-size:14px}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
/* two inputs side by side; iOS date inputs have a wide built-in width unless told they may shrink */
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair input,.pair select{height:46px}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.seg{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;min-height:40px;padding:0 8px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:3px;border:1px solid var(--line2);white-space:nowrap}
.chip.up{color:var(--good);border-color:var(--good)} .chip.down{color:var(--bad);border-color:var(--bad)} .chip.flat{color:var(--ink3)}
.pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border:1px solid var(--line2);border-radius:3px;color:var(--ink2)}

/* hero tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-width:0}
.tile .v{font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small{font-size:16px;font-weight:400;color:var(--ink3);margin-left:1px}
.tile .chip{margin-top:6px}
@media (max-width:420px){.tile .v{font-size:28px}}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:right;font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td:last-child,th:last-child{padding-right:0}
tr:last-child td{border-bottom:0}
td.good{color:var(--good)} td.bad{color:var(--bad)}

/* insights */
.ins{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ins li{padding-left:14px;border-left:2px solid var(--accent)}

/* session list */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.srow b{font-size:16px}
.srow .st{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.srow .go{grid-row:1 / span 2;grid-column:2;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* shot grid */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (min-width:480px){.grid{grid-template-columns:repeat(10,minmax(0,1fr))}}
.cell{position:relative;min-height:46px;border-radius:4px;border:1px solid transparent;font-family:var(--mono);font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 0}
.cell .arw{opacity:.85}
.t1{background:var(--h1);color:var(--ht1)} .t2{background:var(--h2);color:var(--ht2)} .t3{background:var(--h3);color:var(--ht3)} .t4{background:var(--h4);color:var(--ht4)} .t5{background:var(--h5);color:var(--ht5)}
.cell.gap{background:transparent;border:1px dashed var(--line2);color:var(--ink3)}
.cell .no{position:absolute;top:2px;left:4px;font-size:9px;opacity:.7}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}

/* dot plot */
.dp{display:flex;flex-direction:column;gap:2px}
.dp-row{display:grid;grid-template-columns:64px minmax(0,1fr) 48px;align-items:center;gap:8px;min-height:30px}
.dp-l{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.dp-v{font-family:var(--mono);font-size:13px;text-align:right}
.dp-t{position:relative;height:22px}
.dp-t::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dp-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.dp-ref{position:absolute;top:2px;bottom:2px;width:0;border-left:1px dashed var(--ink3)}
.dp-axis{display:grid;grid-template-columns:64px minmax(0,1fr) 48px;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.dp-axis div{display:flex;justify-content:space-between}
.dp.wide .dp-row,.dp.wide .dp-axis{grid-template-columns:96px minmax(0,1fr) 48px}
.dp-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bars */
.br{display:grid;grid-template-columns:62px minmax(0,1fr) 92px;align-items:center;gap:8px;min-height:28px}
.br .tr{height:12px;background:var(--soft);border-radius:2px;overflow:hidden}
.br .tr i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0;min-width:2px}
.br .l{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.br .v{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}

/* compass */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cc{border:1px solid var(--line);border-radius:4px;padding:8px 6px 10px;text-align:center;position:relative;overflow:hidden;min-height:78px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cc .arw{color:var(--accent)}
.cc b{font-size:17px;font-variant-numeric:tabular-nums}
.cc span{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.cc i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.cc.mid{background:var(--soft);justify-content:center}

/* sign-in: card centred in the space below the header */
body.auth{padding-bottom:0}
body.auth main{min-height:calc(100vh - 64px - env(safe-area-inset-top,0px));min-height:calc(100svh - 64px - env(safe-area-inset-top,0px));justify-content:center;align-items:center;padding-block:24px}
.login{width:100%;max-width:420px;border-radius:20px;padding:26px 22px;box-shadow:0 10px 30px rgba(108,29,69,.10),0 1px 3px rgba(108,29,69,.08)}
.login h2{font-size:24px;text-align:center}
.login > .small{text-align:center}
.login input{border-radius:12px}
.login .btn.primary{border-radius:12px;min-height:48px}
.login .note{border-radius:0 8px 8px 0}

/* personal bests */
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rec{display:flex;flex-direction:column;gap:2px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
.rec b{font-size:22px;font-variant-numeric:tabular-nums}

/* target */
.tgtw{max-width:320px;width:100%;margin:0 auto}
.tgtw.sm{max-width:220px}
.tgt{display:block;width:100%;height:auto}
.tgt .ring{fill:none;stroke:var(--line2);stroke-width:.8}
.tgt .ring.ten{fill:var(--soft)}
.tgt .ax{stroke:var(--line);stroke-width:.6}
.tgt .rl{font-family:var(--mono);font-size:6px;fill:var(--ink3);text-anchor:end}
.tgt .sd{stroke:var(--card);stroke-width:.6}
.tgt .h1{fill:var(--h1);stroke:var(--line2)} .tgt .h2{fill:var(--h2)} .tgt .h3{fill:var(--h3)} .tgt .h4{fill:var(--h4)} .tgt .h5{fill:var(--h5)}
.tgt .bias{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 1.5}
.tgt .gc{stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.bias-t{margin:0;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.bias-t .arw{flex:none;margin-top:3px;color:var(--accent)}
details.more summary{min-height:44px}

/* series result */
.res .big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pop{animation:pop .45s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* line chart */
.lc{position:relative;touch-action:pan-y}
.lc svg{display:block;width:100%;height:auto;overflow:visible}
.lc text{font-family:var(--mono);font-size:10.5px;fill:var(--ink3)}
.lc .val{fill:var(--ink);font-size:11px}
.lc .gl{stroke:var(--line);stroke-width:1}
.lc .ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.lc .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.lc .cross{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:11.5px;padding:6px 8px;border-radius:3px;pointer-events:none;white-space:nowrap;z-index:5}
.tip[hidden]{display:none}

/* pads */
.pads{display:flex;flex-direction:column;gap:12px}
.pw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pk{min-height:46px;border:1px solid var(--line2);background:var(--card);border-radius:4px;font-family:var(--mono);font-size:17px;font-weight:500}
.pk[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pk:disabled{opacity:.3}
.pdir{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:210px}
.pdir .pk{min-height:48px;display:flex;align-items:center;justify-content:center;font-size:12px}
.read{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.last{display:flex;gap:6px;flex-wrap:wrap}
.last span{font-family:var(--mono);font-size:13px;padding:3px 7px;border-radius:3px}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(10,0,8,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--bg);border:1px solid var(--line2);border-radius:10px 10px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:13px;padding:9px 14px;border-radius:4px;z-index:80;max-width:90%;text-align:center}
#toast[hidden]{display:none}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line2);padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;position:relative}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--accent)}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--accent)}
nav .fab{color:var(--ink2)}
nav .fab i{width:56px;height:56px;margin-top:-26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--bg),0 4px 14px rgba(26,0,16,.25);transition:transform .15s}
nav .fab i svg{width:26px;height:26px}
nav .fab:active i{transform:scale(.94)}
nav .fab[aria-current=page]::before{display:none}
#app{view-transition-name:app} header{view-transition-name:hdr} nav{view-transition-name:nav}
::view-transition-old(app){animation:vt-out .14s ease-in both}
::view-transition-new(app){animation:vt-in .22s ease-out both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(6px)}}
details summary{cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);min-height:32px;display:flex;align-items:center}
.note{font-size:13px;color:var(--ink2);border-left:2px solid var(--warn);padding-left:10px}
.empty{text-align:center;padding:26px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:56px;height:56px;color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.cell.conflict{outline:2px solid var(--warn);outline-offset:1px}
.check{font-size:13px;display:flex;gap:8px;align-items:center}
.check.ok{color:var(--good)} .check.bad{color:var(--bad)}
.busy{position:fixed;inset:0;z-index:70;background:rgba(10,0,8,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.busy .box{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:26px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.busy svg{width:64px;height:64px;color:var(--accent)}

function T(v){ return Math.round(v*10); }

function calc(s, cfg){

  o.buckets = [['10s',100,1e9],['9s',90,100],['8s',80,90],['7s',70,80],['Under 7',-1e9,70]].map(function(b){
    var c = t.filter(function(v){ return v >= b[1] && v < b[2]; }).length;
    return {k:b[0], c:c, pct:n ? 100*c/n : 0};
  });
  if (n > 1){
    var m = sumT/n;
    var ss = t.reduce(function(a,v){ return a + (v-m)*(v-m); }, 0);
    o.sd = Math.sqrt(ss/(n-1))/10;
  } else o.sd = null;
  var map = {};
  sh.forEach(function(x){ var k = seriesNo(x.n); (map[k] = map[k] || []).push(x); });
  o.series = Object.keys(map).map(Number).sort(function(a,b){ return a-b; }).map(function(k){
    var a = map[k];
    var st = a.reduce(function(p,x){ return p + T(x.s); }, 0);
    return {no:k, n:a.length, sum:st/10, avg:st/10/a.length,
      tens:a.filter(function(x){ return T(x.s) >= tt; }).length,

}
function compare(c, b){

  if (mx - mn < 1e-9){ mn -= 1; mx += 1; }
  var raw = (mx-mn)/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/mag;
  var step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  var lo = Math.floor(mn/step + 1e-9)*step, hi = Math.ceil(mx/step - 1e-9)*step, t = [];

  var t = shots.reduce(function(a, x){ return a + T(x.s); }, 0);

  return {sum:t/10, subtotal:has ? +subtotal : null, ok:has ? t === T(subtotal) : null};

function shotRanges(ns){

// Approximate position in ring units (10.9 = centre, one ring per point); y grows downward like SVG.
// shortcut: the scoreboard only gives 8 directions, so angles snap to 45°.
function shotXY(x){

// Where the group sits: centroid direction, and how many sub-10 shots went that way (±45°).
function groupBias(shots){

// A re-scan of a saved photo: the session that already holds every scanned shot with the same score and arrow.

    var have = {}; shotsOf(list[i]).forEach(function(x){ have[x.n] = x; });

function bindCharts(){

/* ----- Summary ----- */
function insights(cur, c, list, idx){
  var out = [];
  if (c.under7 > 0 && c.n >= 10){
    var rest = shotsOf(cur).filter(function(x){ return T(x.s) >= 70; });
    var sumR = rest.reduce(function(a,x){ return a + T(x.s); }, 0)/10;
    var avgR = sumR/rest.length;
    out.push(c.under7 + (c.under7 === 1 ? ' shot' : ' shots') + ' under 7 pulled the average down. Without ' + (c.under7 === 1 ? 'it' : 'them') + ' it would be ' + f2(avgR) + ' instead of ' + f2(c.avg) + ' (' + signed((avgR - c.avg)/c.avg*100, 1, '%') + ').');
  }
  if (c.series.length >= 3){
    var ser = c.series.filter(function(s){ return s.n >= 5; });
    if (ser.length >= 2){
      var best = ser.reduce(function(a,b){ return b.avg > a.avg ? b : a; }), worst = ser.reduce(function(a,b){ return b.avg < a.avg ? b : a; });
      out.push('Best series was ' + best.no + ' (' + f2(best.avg) + ' average, ' + best.tens + ' tens). Weakest was ' + worst.no + ' (' + f2(worst.avg) + ').');
    }
  }
  if (c.fade != null){
    var d = c.fade;
    out.push('First ' + c.half + ' shots averaged ' + f2(c.first) + ', the rest ' + f2(c.second) + ' (' + signed(d, 2) + '). ' + (d <= -0.1 ? 'Scores faded as the session went on.' : d >= 0.1 ? 'You finished stronger than you started.' : 'Steady from start to finish.'));
  }
  var ds = dirStats(list);
  if (ds.total >= 30){
    var low = ds.by['↙'].c + ds.by['↓'].c + ds.by['↘'].c, high = ds.by['↖'].c + ds.by['↑'].c + ds.by['↗'].c;
    var left = ds.by['↖'].c + ds.by['←'].c + ds.by['↙'].c, right = ds.by['↗'].c + ds.by['→'].c + ds.by['↘'].c;
    var topDir = DIRS.reduce(function(a,b){ return ds.by[b].c > ds.by[a].c ? b : a; });
    out.push('Of ' + ds.total + ' shots with a direction, ' + (100*low/ds.total).toFixed(0) + '% landed low (' + (100*high/ds.total).toFixed(0) + '% high) and ' + (100*right/ds.total).toFixed(0) + '% right (' + (100*left/ds.total).toFixed(0) + '% left). Most common: ' + topDir + ' at ' + ds.by[topDir].pct.toFixed(0) + '%.');
  }
  return out;
}

}
function viewDetail(s){

    + c.series.map(function(r){ return '<tr><td>' + r.no + '</td><td>' + r.n + '</td><td>' + f1(r.sum) + '</td><td>' + f2(r.avg) + '</td><td>' + r.tens + '</td><td>' + esc(r.time || '–') + '</td></tr>'; }).join('')
    + '</tbody></table></div>' + dotPlot(c.series.map(function(r){ return {l:'Series ' + r.no, v:r.n >= 3 ? r.avg : null, tip:r.n + ' shots'}; }), {ref:c.avg, aria:'Series averages'}) + '</section>';
  h += '<section class="card stack"><h3>Score spread</h3>' + bucketBars(c.buckets) + '</section>';

}
function labelOptions(cur){
  var opts = LABELS.slice(); if (opts.indexOf(cur) < 0) opts.unshift(cur);
  return opts.map(function(l){ return '<option' + (l === cur ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('');
}

/* ----- Trends ----- */
var METRICS = {
  avg:{name:'Average per shot', get:function(c){ return c.avg; }, fmt:function(v, ax){ return v.toFixed(2); }},
  tens:{name:'Tens %', get:function(c){ return c.tensPct; }, fmt:function(v, ax){ return v.toFixed(ax ? 0 : 1) + '%'; }},
  pace:{name:'60-shot pace', get:function(c){ return c.pace; }, fmt:function(v, ax){ return v.toFixed(ax ? 0 : 1); }},
  sd:{name:'Spread (SD, lower is tighter)', get:function(c){ return c.sd; }, fmt:function(v, ax){ return v.toFixed(2); }}
};
function viewTrends(){
  var list = sorted().filter(function(s){ return calc(s, cfg()).n >= 10; });
  var all = sorted(); if (!all.length) return emptyState();
  var m = METRICS[state.metric], h = '';
  h += '<section class="card stack"><div class="seg" role="group" aria-label="Metric">' + Object.keys(METRICS).map(function(k){ return '<button data-act="metric" data-v="' + k + '" aria-pressed="' + (state.metric === k) + '">' + ({avg:'Average',tens:'Tens %',pace:'Pace',sd:'Spread'})[k] + '</button>'; }).join('') + '</div>'
    + '<div class="row between"><h2 style="font-size:17px">' + esc(m.name) + '</h2><span class="lab">' + list.length + ' sessions</span></div>';
  if (!list.length) h += '<div class="muted small">Sessions need at least 10 logged shots to show here.</div>';
  else {
    var pts = list.map(function(s, i){
      var c = calc(s, cfg()), v = m.get(c), p = i > 0 ? m.get(calc(list[i-1], cfg())) : null;
      return {v:v, l1:shortDate(s.date), l2:s.label.slice(0, 4), tip:nameOf(s) + ' · ' + m.fmt(v) + ' · ' + c.n + ' shots' + (p != null && state.metric !== 'tens' ? ' · ' + signed(v - p, 2) + ' vs before' : p != null ? ' · ' + signed(v - p, 1, ' pts') + ' vs before' : '')};
    }).filter(function(p){ return p.v != null; });
    h += lineChart('trend', pts, {fmt:m.fmt, aria:m.name + ' by session'});
    h += '<div class="tw"><table><thead><tr><th>Session</th><th>Shots</th><th>Avg</th><th>Tens</th><th>Pace</th><th>SD</th></tr></thead><tbody>'
      + list.slice().reverse().map(function(s){ var c = calc(s, cfg()); return '<tr><td>' + esc(shortName(s)) + '</td><td>' + c.n + '</td><td>' + f2(c.avg) + '</td><td>' + f1(c.tensPct) + '%</td><td>' + f1(c.pace) + '</td><td>' + f2(c.sd) + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
  }
  h += '</section>';
  var pl = calc(pool(all), cfg());
  h += '<section class="card stack"><h3>All shots together</h3><div class="tiles"><div class="tile"><div class="lab">Shots</div><div class="v">' + pl.n + '</div></div><div class="tile"><div class="lab">Tens</div><div class="v">' + f1(pl.tensPct) + '<small>%</small></div></div><div class="tile"><div class="lab">Average</div><div class="v">' + f2(pl.avg) + '</div></div></div>' + bucketBars(pl.buckets) + '</section>';
  var bs = bySeriesNo(all);
  if (bs.length > 1) h += '<section class="card stack"><h3>Which series are strongest</h3>' + dotPlot(bs.map(function(r){ return {l:'Series ' + r.no, v:r.n >= 5 ? r.avg : null, tip:r.n + ' shots'}; }), {ref:pl.avg, refLabel:'overall average', aria:'Average by series number'}) + '<div class="muted small">Average of every shot taken in that series number, across all sessions.</div></section>';
  var bp = byPosition(all);
  h += '<section class="card stack"><h3>Shot 1 to 10 within a series</h3>' + dotPlot(bp.map(function(r){ return {l:'Shot ' + r.pos, v:r.n >= 5 ? r.avg : null, tip:r.n + ' shots'}; }), {ref:pl.avg, refLabel:'overall average', aria:'Average by shot position in series'}) + '<div class="muted small">Shows whether the early or late shots of a series are weaker.</div></section>';
  h += '<section class="card stack"><h3>Where shots land</h3>' + target(pool(all).shots) + byDir(dirStats(all)) + '</section>';
  return h;
}

/* ----- Log ----- */
function pads(P){
  var h = '<div class="pads"><div><div class="lab" style="margin-bottom:6px">Score · whole number</div><div class="pw">';
  [4,5,6,7,8,9,10].forEach(function(w){ h += '<button class="pk" data-act="whole" data-v="' + w + '" aria-pressed="' + (P.whole === w) + '">' + w + '</button>'; });
  h += '</div></div><div><div class="lab" style="margin-bottom:6px">Decimal</div><div class="pd">';
  for (var k = 0; k <= 9; k++) h += '<button class="pk" data-act="dec" data-v="' + k + '" aria-pressed="' + (P.dec === k) + '">.' + k + '</button>';
  h += '</div></div><div><div class="lab" style="margin-bottom:6px">Where it landed (optional)</div><div class="pdir">';
  ['↖','↑','↗','←','C','→','↙','↓','↘'].forEach(function(d){
    if (d === 'C') h += '<button class="pk" data-act="dir" data-v="" aria-pressed="' + (P.dir === '') + '" aria-label="No direction">none</button>';
    else h += '<button class="pk" data-act="dir" data-v="' + d + '" aria-pressed="' + (P.dir === d) + '" aria-label="' + d + '">' + arrow(d, 20) + '</button>';
  });
  return h + '</div></div></div>';
}
function readout(P){ return (P.whole == null ? '–' : P.whole) + '.' + (P.dec == null ? '–' : P.dec); }
function scanCard(){
  var b = state.scanBusy;
  return '<section class="card stack"><button class="btn primary block" data-act="scan-pick"' + (b ? ' disabled' : '') + '>' + (b ? 'Reading photo…' : state.log.result ? 'Scan next series' : 'Scan scoreboard') + '</button>'
    + '<div class="muted small">Take a photo or choose one from your photos or files. One photo per series; you check every shot before it is saved.</div></section>';
}
function scanTarget(S){ return getSession(makeId(S.date, S.separate ? 'Other' : S.label)); }
function viewScan(){
  var S = state.scan, target = scanTarget(S), main = getSession(makeId(S.date, S.label));
  var hit = {}; scanConflicts(target, S.shots).forEach(function(n){ hit[n] = 1; });
  var chk = scanCheck(S.shots, S.subtotal), canSave = S.date && S.shots.length && (!S.sighter || S.override);
  var base = target || {id:'', date:S.date, label:S.label, fired:cfg().planned, shots:[], seriesTimes:{}};
  var miss = calc(mergeShots(base, S.shots, S.time), cfg()).missing, dup = alreadySaved(state.sessions, S.shots);
  var h = '<section class="card stack"><div><div class="lab">Scanned scoreboard</div><h2>Check the reading</h2></div>'
    + '<div class="pair"><label class="f"><span class="lab">Date on screen</span><input type="date" data-field="scan-date" value="' + esc(S.date) + '"></label>'
    + '<label class="f"><span class="lab">Session</span><select data-field="scan-label">' + labelOptions(S.label) + '</select></label></div>'
    + (S.dateRead || dup ? '' : '<div class="note">The date on the screen was not readable. Check it before saving.</div>')
    + (dup ? '<div class="check ok">✓ Already saved in ' + esc(nameOf(dup)) + '</div><div class="small ink2">All ' + S.shots.length + ' shots on this photo are saved there with the same scores and arrows, so there is nothing new to save. Change a shot below if the saved one is wrong.</div>' : '');
  var by = {}, gaps = 0; S.shots.forEach(function(x){ by[x.n] = x; });
  h += '<div class="grid">';
  S.series.forEach(function(k){
    for (var n = (k-1)*10 + 1; n <= k*10; n++){
      var x = by[n];
      if (x) h += '<button class="cell t' + tier(x.s) + (hit[x.n] ? ' conflict' : '') + '" data-act="scan-edit" data-n="' + n + '" aria-label="Shot ' + n + ', ' + f1(x.s) + (x.d ? ', ' + x.d : ', no direction') + '"><span class="no">' + n + '</span>' + f1(x.s) + (x.d ? arrow(x.d, 16) : '<span class="arw">–</span>') + '</button>';
      else { gaps++; h += '<button class="cell gap" data-act="scan-edit" data-n="' + n + '" aria-label="Shot ' + n + ' not on the photo, add it"><span class="no">' + n + '</span>+</button>'; }
    }
  });
  h += '</div><div class="muted small">Tap a shot to fix its score or arrow.' + (gaps ? ' Tap + to add a shot the photo didn\'t show.' : '') + '</div>';
  h += chk.ok === true ? '<div class="check ok">✓ Matches screen subtotal ' + f1(chk.subtotal) + '</div>'
    : chk.ok === false ? '<div class="note">Shots add up to ' + f1(chk.sum) + ', screen says ' + f1(chk.subtotal) + '. Check before saving.</div>'
    : '<div class="check muted">No subtotal on screen to check</div>';
  if (dup) return h + '<div class="row"><button class="btn primary grow" data-act="scan-dup-open" data-id="' + esc(dup.id) + '">Open session</button><button class="btn" data-act="scan-discard">Done</button></div></section>';
  if (scanConflicts(main, S.shots).length) h += '<div class="note">Some of these shots are already saved in ' + esc(nameOf(main)) + ' with different values (outlined).</div>'
    + '<div class="seg" role="group" aria-label="Saved shots"><button data-act="scan-sep" data-v="0" aria-pressed="' + !S.separate + '">Replace saved shots</button><button data-act="scan-sep" data-v="1" aria-pressed="' + !!S.separate + '">Save as separate session (Other)</button></div>';
  if (S.sighter) h += '<div class="note">This looks like a sighter screen, not match shots.</div><label class="row small"><input type="checkbox" data-field="scan-override"' + (S.override ? ' checked' : '') + '> Save these as match shots anyway</label>';
  if (miss.length) h += '<div class="muted small">Not logged yet in this session: shots ' + shotRanges(miss) + '.</div>';
  h += '<div class="row"><button class="btn primary grow" data-act="scan-save"' + (canSave ? '' : ' disabled') + '>Save ' + S.shots.length + ' shot' + (S.shots.length === 1 ? '' : 's') + '</button><button class="btn" data-act="scan-discard">Discard</button></div></section>';
  return h;
}
function seriesResult(s, R){
  var c = calc(s, cfg()), list = sorted(), h = '';
  R.nos.forEach(function(no){
    var r = c.series.filter(function(x){ return x.no === no; })[0]; if (!r) return;
    var shots = shotsOf(s).filter(function(x){ return seriesNo(x.n) === no; }), u = usualSeries(list, s.id, no);
    h += '<section class="card stack res' + (R.pop ? ' pop' : '') + '"><div class="row between"><div><div class="lab">Series ' + no + ' result</div><h2>' + esc(nameOf(s)) + '</h2></div><span class="check ok">✓ Saved</span></div>'
      + '<div class="row" style="align-items:flex-end;gap:14px"><div class="big"><span data-count="' + r.sum + '" data-dp="1">' + f1(r.sum) + '</span></div>'
      + '<div class="stack" style="gap:4px">' + (r.n === 10 && u ? chip(r.sum - u.avg, 1, '', true) + '<span class="muted small">vs your usual ' + f1(u.avg) + '</span>' : '<span class="muted small">' + r.n + ' of 10 shots' + (u ? '' : ' · comparison after 2 full series') + '</span>') + '</div></div>'
      + '<div class="small ink2">' + r.tens + ' ten' + (r.tens === 1 ? '' : 's') + ' · average ' + f2(r.avg) + '</div>'
      + target(shots, {small:true, note:false}) + '</section>';
  });
  return h;
}
function viewLog(){
  if (state.scan) return viewScan();
  var s = state.log.active && getSession(state.log.active), R = state.log.result, h = '';
  if (s && R && R.id === s.id){ h += seriesResult(s, R); R.pop = false; }
  h += scanCard();
  if (s){
    var c = calc(s, cfg());
    h += '<section class="card stack"><div class="row between"><div><div class="lab">Last scanned</div><h2>' + esc(nameOf(s)) + '</h2></div><span class="pill">' + c.n + ' / ' + c.fired + ' shots</span></div>'
      + (c.missing.length ? '<div class="muted small">Not logged yet: shots ' + shotRanges(c.missing) + '.</div>' : '<div class="check ok">✓ All ' + c.fired + ' shots logged</div>')
      + '<button class="btn block" data-act="open-log">View session</button></section>';
  }
  return h;
}

/* ---------- import / export ---------- */
function toISO(v){
  if (v == null || v === '') return '';

  if (typeof v === 'number' && v > 20000 && v < 80000){ var o = XLSX.SSF.parse_date_code(v); return o.y + '-' + pad2(o.m) + '-' + pad2(o.d); }

  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  if ((m = s.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3})[A-Za-z]*[-\s\/](\d{4})$/))){ var mi = MONTHS.map(function(x){ return x.toLowerCase(); }).indexOf(m[2].toLowerCase()); if (mi >= 0) return m[3] + '-' + pad2(mi+1) + '-' + pad2(+m[1]); }
  if ((m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/))) return m[3] + '-' + pad2(+m[2]) + '-' + pad2(+m[1]);
  return '';
}
function toHM(v){

  if (typeof v === 'number' && v >= 0 && v < 1){ var mins = Math.round(v*1440); return pad2(Math.floor(mins/60)) + ':' + pad2(mins%60); }
  var m = String(v).trim().match(/^(\d{1,2}):(\d{2})/); return m ? pad2(+m[1]) + ':' + m[2] : '';
}
function normDir(v){
  var s = String(v == null ? '' : v).trim();
  if (DIRS.indexOf(s) >= 0) return s;
  var map = {N:'↑',NE:'↗',E:'→',SE:'↘',S:'↓',SW:'↙',W:'←',NW:'↖'};

}
function normH(h){ return String(h == null ? '' : h).trim().toLowerCase(); }

  }

    var date = toISO(cD >= 0 ? r2[cD] : '') || sheetDate; if (!date) continue;
    var label = cS >= 0 && r2[cS] ? String(r2[cS]).trim() : 'Session';
    var id = makeId(date, label);
    var type = cT >= 0 && r2[cT] != null ? String(r2[cT]).trim() : '';
    var get = function(){ return out[id] || (out[id] = {id:id, date:date, label:label, shots:[], seriesTimes:{}, fired:0, screenTotal:null, note:'', createdAt:Date.now()}); };
    if (/session total/i.test(type)){
      var total = cSc >= 0 ? r2[cSc] : null, sess = get();

async function readFile(file){

    + '<div class="row between"><div><div class="lab">' + esc(title) + '</div><h2>Shot ' + E.n + ' <span class="muted" style="font-weight:400;font-size:15px">· series ' + seriesNo(E.n) + '</span></h2></div><div class="read mono" style="font-size:36px">' + readout(E) + '</div></div>'
    + pads(E) + '<div class="row"><button class="btn primary grow" data-act="edit-save">Save shot</button>' + (E.exists ? '<button class="btn danger" data-act="edit-del">Delete</button>' : '') + '<button class="btn" data-act="edit-close">Cancel</button></div></div></div>';
}
function reduced(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
function fade(fn){ if (document.startViewTransition && !reduced()) document.startViewTransition(fn); else fn(); }
function countUp(){
  if (reduced()) return;
  [].forEach.call(document.querySelectorAll('[data-count]'), function(el){
    var to = +el.dataset.count, dp = +el.dataset.dp, t0 = performance.now();
    (function step(t){ var k = Math.min(1, (t - t0)/650), e = 1 - Math.pow(1 - k, 3); el.textContent = (to*e).toFixed(dp); if (k < 1) requestAnimationFrame(step); })(t0);
  });
}
function render(){
  var y = window.scrollY, nav = document.querySelector('nav');
  if (!state.user || state.auth.mode === 'recover'){
    document.body.classList.add('auth'); nav.hidden = true; $app.innerHTML = viewAuth(); document.getElementById('modal').innerHTML = ''; setSyncUI(); return;
  }
  document.body.classList.remove('auth'); nav.hidden = false;
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    var cur = state.tab === t[0] ? ' aria-current="page"' : '';
    if (t[0] === 'log') return '<button class="fab" data-act="scan-pick" aria-label="Scan scoreboard"' + cur + '><i>' + ICONS.log + '</i><span>' + t[1] + '</span></button>';
    return '<button data-act="tab" data-v="' + t[0] + '"' + cur + '>' + ICONS[t[0]] + '<span>' + t[1] + '</span></button>';
  }).join('');
  document.getElementById('scan').disabled = !!state.scanBusy;
  chartData = {};
  var v = state.tab === 'summary' ? viewSummary() : state.tab === 'log' ? viewLog() : state.tab === 'sessions' ? viewSessions() : state.tab === 'trends' ? viewTrends() : viewData();
  // Full re-render would collapse open sections (and hide e.g. "Tap again to delete"); reopen them.
  var open = [].map.call($app.querySelectorAll('details[open][id]'), function(d){ return d.id; });
  $app.innerHTML = v;
  open.forEach(function(id){ var d = document.getElementById(id); if (d) d.open = true; });
  document.getElementById('modal').innerHTML = state.scanBusy ? scanOverlay() : editSheet();
  bindCharts(); setSyncUI();
  if (state.countUp && state.sessions.length){ state.countUp = false; countUp(); }
  if (!state.openId || state.tab !== 'sessions') { /* keep scroll */ }
  window.scrollTo(0, y);
}
window.__raptor = {state:state, render:render, calc:calc, handlers:handlers, readFile:readFile};
initStore();
})();
